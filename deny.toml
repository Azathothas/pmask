# Supply chain gate: the dependency set is a selling point, so CI keeps it
# true.  The crate is 0BSD and every dependency must be permissive.
[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# 0BSD, MIT, Apache-2.0 and their usual combinations, plus the
# Unicode-3.0 licence that unicode-ident carries.
allow = [
    "0BSD",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
