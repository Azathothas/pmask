name: release

# A tag `vX.Y.Z[-pre]` builds the release binaries and publishes them, with
# checksums, provenance and a signature, as a GitHub release (a prerelease
# when the tag has a suffix). The notes come from docs/releases/<tag>.md,
# which must exist.
#
# Run by hand (workflow_dispatch) on main, it builds and checks the same
# binaries and keeps them as artifacts: a dry run that publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  PMASK_BUILD_COMMIT: ${{ github.sha }}
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is_tag: ${{ steps.tag.outputs.is_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the version, the tag, the CI and the notes
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sh scripts/version.sh)
          case "$GITHUB_REF" in
            refs/tags/v*) tag=$GITHUB_REF_NAME; is_tag=true ;;
            *)            tag="v$version";     is_tag=false ;;
          esac
          if [ "$is_tag" = true ]; then
            test "$tag" = "v$version" || { echo "the tag $tag is not v$version"; exit 1; }
            sha=$(git rev-parse HEAD)
            state=none
            for i in $(seq 1 30); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push" \
                --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')
              [ "$state" = success ] && break
              [ "$state" = none ] || { echo "ci at $sha: $state"; exit 1; }
              sleep 30
            done
            [ "$state" = success ] || { echo "ci at $sha is not green"; exit 1; }
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "the release $tag exists; delete it before a re-run: gh release delete $tag --yes"
              exit 1
            fi
          fi
          notes="docs/releases/$tag.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          grep -qx '## Breaking' "$notes" || { echo "$notes has no heading: ## Breaking"; exit 1; }
          test "$(wc -c < "$notes")" -lt 120000 || { echo "the notes are too long"; exit 1; }
          grep -q "pmask $version"  man/pmask.1  || { echo "man/pmask.1 does not name pmask $version"; exit 1; }
          grep -q "pmaskd $version" man/pmaskd.8 || { echo "man/pmaskd.8 does not name pmaskd $version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: build (static musl)
        run: cargo build --locked --release --target ${{ matrix.target }} --bin pmask --bin pmaskd
      - name: the binaries are static
        run: sh scripts/check-static.sh target/${{ matrix.target }}/release/pmask target/${{ matrix.target }}/release/pmaskd
      - name: the version
        run: |
          want=${{ needs.preflight.outputs.version }}
          for b in pmask pmaskd; do
            got=$(target/${{ matrix.target }}/release/$b --version)
            test "$got" = "$b $want ($PMASK_BUILD_COMMIT)" || { echo "$b prints \"$got\""; exit 1; }
          done
      - name: it runs
        run: |
          target/${{ matrix.target }}/release/pmask --help > /dev/null
          target/${{ matrix.target }}/release/pmask probe > /dev/null
          target/${{ matrix.target }}/release/pmask --label ci-runner /bin/true
          target/${{ matrix.target }}/release/pmaskd --help > /dev/null
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pmask  dist/pmask-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pmaskd dist/pmaskd-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: the third-party notices
        run: |
          python3 scripts/notices.py
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          test -s dist/THIRD_PARTY_NOTICES.md
          head -1 dist/THIRD_PARTY_NOTICES.md | grep -qx '# Third-party notices'
          test "$(wc -l < dist/THIRD_PARTY_NOTICES.md)" -gt 10
      - name: the man pages, the completions and the units
        run: |
          set -eu
          cp man/pmask.1 man/pmaskd.8 dist/
          mkdir -p stage
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            d="pmask-${{ needs.preflight.outputs.version }}-$t"
            mkdir -p "stage/$d/completions" "stage/$d/contrib"
            cp "dist/pmask-$t" "dist/pmaskd-$t" "stage/$d/"
            cp man/pmask.1 man/pmaskd.8 LICENSE README.md dist/THIRD_PARTY_NOTICES.md "stage/$d/"
            cp completions/* "stage/$d/completions/"
            cp -r contrib/systemd contrib/sysusers.d contrib/tmpfiles.d "stage/$d/contrib/"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -C stage -cf - "$d" | gzip -9n > "dist/$d.tar.gz"
          done
      - name: checksums
        run: |
          set -eu
          cd dist
          sha256sum pmask-* pmaskd-* pmask.1 pmaskd.8 THIRD_PARTY_NOTICES.md > SHA256SUMS
          cat SHA256SUMS
      - name: the provenance of the binaries
        id: attest
        if: needs.preflight.outputs.is_tag == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: the provenance bundle, beside the files
        if: needs.preflight.outputs.is_tag == 'true'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.sigstore.json
      - name: the provenance, checked
        if: needs.preflight.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --bundle dist/provenance.sigstore.json \
              --signer-workflow "$signer" --source-ref "$GITHUB_REF" > /dev/null
          }
          for f in dist/pmask-* dist/pmaskd-* dist/*.tar.gz; do
            verify "$f"
            echo "ok   $f"
          done
          cp dist/pmask-x86_64-unknown-linux-musl "$RUNNER_TEMP/changed"
          echo changed >> "$RUNNER_TEMP/changed"
          if verify "$RUNNER_TEMP/changed" 2> /dev/null; then echo "a changed copy verified"; exit 1; fi
          echo "each file names $signer at $GITHUB_REF; a changed copy fails"
      - name: the body of the release
        run: |
          set -eu
          tag=${{ needs.preflight.outputs.tag }}
          {
            cat "docs/releases/$tag.md"
            printf '\n---\n\n'
            printf 'The binaries are static musl. `SHA256SUMS` holds the SHA-256 of each file.\n'
            printf '`gh attestation verify FILE --repo %s` checks the provenance.\n' "$GITHUB_REPOSITORY"
            printf 'The manual pages are `pmask.1` and `pmaskd.8`; the completions and units are in the tarball.\n'
          } > "$RUNNER_TEMP/body.md"
          test "$(wc -c < "$RUNNER_TEMP/body.md")" -lt 120000
      - name: publish
        if: needs.preflight.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=${{ needs.preflight.outputs.tag }}
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          gh release create "$tag" $pre --verify-tag --title "pmask $tag" \
            --notes-file "$RUNNER_TEMP/body.md" dist/*
      - name: the files and the body that a dry run would publish
        if: needs.preflight.outputs.is_tag != 'true'
        run: cp "$RUNNER_TEMP/body.md" dist/BODY.md
      - if: needs.preflight.outputs.is_tag != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/*
          if-no-files-found: error
