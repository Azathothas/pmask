# The store directory only.
#
# 0700 on the directory and 0600 on the store: pmask creates both with
# those modes itself, so this entry only matters for the directory chain
# on a machine where nothing has run yet, and for the case an
# administrator pre-creates it under a service account.
#
# There is deliberately no `f` line for store.enc.  A tmpfiles `f` entry
# creates a zero-byte file at boot, and `pmask store init` then refuses
# with "already exists" (255) while `store set` refuses the truncated
# header.  `pmask store init` creates the file, its mode and its header
# in one write; pre-creating an empty one only breaks it.
d /var/lib/pmask 0700 pmask pmask -
