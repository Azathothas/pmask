# The store directory and its file.
#
# 0700 on the directory and 0600 on the store: pmask creates both with
# those modes itself, so this entry only matters for the directory chain
# on a machine where nothing has run yet, and for the case an
# administrator pre-creates it under a service account.
d /var/lib/pmask 0700 pmask pmask -
f /var/lib/pmask/store.enc 0600 pmask pmask -
