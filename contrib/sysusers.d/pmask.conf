# A fixed holder account, for the deployments where DynamicUser= is the
# wrong shape: a store that has to survive the unit, or a passphrase file
# owned by one uid.
#
# pmaskd@.service uses DynamicUser=yes by default; drop that line and
# set User=pmask to use this account instead.
u pmask - "pmask secret holder" /var/lib/pmask
