[package]
name = "pmask"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.85"
description = "Confidential execution without trusted hardware: redact the /proc metadata of a process tree while programs keep their real arguments"
license = "0BSD"
repository = "https://github.com/Azathothas/pmask"
readme = "README.md"
documentation = "https://docs.rs/pmask"
keywords = ["privacy", "secrets", "ptrace", "process", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
build = "build.rs"
default-run = "pmask"
exclude = [
    "/.cargo",
    "/.github",
    "/.gitignore",
    "/AGENTS.md",
    "/build.sh",
    "/contrib",
    "/deny.toml",
    "/docs",
    "/fuzz",
    "/measurements",
    "/scripts",
    "/tests",
    "/vm",
    "/vendor",
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.pmask]
# The switch of the publish to crates.io (.github/workflows/publish.yml).
# false: each run is a dry run. The crate name is reserved separately.
crates-io = false

[features]
default = []
testbins = []

[lib]
name = "pmask"
path = "src/lib.rs"

[[bin]]
name = "pmask"
path = "src/main.rs"

[[bin]]
name = "pmaskd"
path = "src/bin/pmaskd.rs"

[[bin]]
name = "pmask-testcases"
path = "src/bin/testcases.rs"
required-features = ["testbins"]

[[bin]]
name = "pmask-protocases"
path = "src/bin/protocases.rs"
required-features = ["testbins"]

[dependencies]
libc = "0.2"
zeroize = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
